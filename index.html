<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun English Quiz for Kids!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4; /* Light green background */
            background-image: radial-gradient(#dcfce7 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .btn-topic {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-topic:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .btn-answer {
            transition: all 0.2s;
        }
        .btn-answer:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }
        .correct-answer {
            background-color: #22c55e !important; /* Green-500 */
            color: white !important;
            border-color: #16a34a !important;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }
        .wrong-answer {
            background-color: #ef4444 !important; /* Red-500 */
            color: white !important;
            border-color: #dc2626 !important;
        }
        /* Confetti Animation for perfect score */
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            z-index: 100;
            animation: confetti-fall 3s linear forwards;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Fallback Pseudo Fullscreen when permissions policy restricts native fullscreen in iFrames */
        .is-pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            margin: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 99999 !important;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">
    <div id="app" class="flex-grow flex flex-col relative w-full h-full max-w-6xl mx-auto bg-white shadow-2xl overflow-hidden sm:rounded-2xl sm:my-2 lg:my-4 sm:h-[calc(100vh-1rem)] lg:h-[calc(100vh-2rem)] border-4 border-green-200">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-green-400 to-blue-500 text-white p-3 sm:p-4 shadow-md flex justify-between items-center z-10 shrink-0">
            <h1 class="text-xl sm:text-2xl lg:text-3xl font-extrabold tracking-wider flex items-center gap-2">
                🌟 English Class Best Academy 🌟
            </h1>
            <div class="flex items-center gap-2 sm:gap-3">
                <button id="btn-fullscreen" class="bg-white/20 hover:bg-white/30 active:scale-95 text-white font-bold py-1.5 px-3 rounded-full transition-all flex items-center gap-2 text-xs sm:text-sm border border-white/40 shadow-sm backdrop-blur-sm cursor-pointer">
                    <span id="fullscreen-icon" class="text-base sm:text-lg">⛶</span>
                    <span class="hidden sm:inline" id="fullscreen-text">Full Screen</span>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow relative overflow-y-auto overflow-x-hidden p-4 sm:p-6 lg:p-8 bg-blue-50/50 flex flex-col">
            
            <!-- MENU VIEW -->
            <div id="menu-view" class="w-full h-full flex flex-col fade-in justify-start">
                <div class="text-center mb-6 sm:mb-8 mt-2">
                    <h2 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-indigo-700 mb-2 drop-shadow-sm">Choose a Topic!</h2>
                    <p class="text-gray-500 text-base sm:text-lg lg:text-xl mb-6 font-semibold">Pick what you want to learn today.</p>
                    
                    <!-- Level Selection Buttons -->
                    <div class="flex justify-center items-center gap-2 sm:gap-3 bg-white/80 backdrop-blur-sm p-2 sm:p-3 rounded-2xl border-2 border-indigo-100 max-w-lg mx-auto shadow-sm">
                        <span class="font-extrabold text-indigo-900 text-sm sm:text-base uppercase tracking-wide mr-2">Level:</span>
                        <button id="btn-level-easy" onclick="setLevel('easy')" class="btn-level bg-green-500 text-white font-bold px-4 sm:px-5 py-2 rounded-xl text-sm sm:text-base shadow-md border-2 border-green-600 transform scale-105 transition-all cursor-pointer flex items-center gap-1">
                            <span>🟢</span> Easy
                        </button>
                        <button id="btn-level-medium" onclick="setLevel('medium')" class="btn-level bg-white text-gray-700 hover:bg-yellow-100 font-bold px-4 sm:px-5 py-2 rounded-xl text-sm sm:text-base border border-gray-300 transition-all cursor-pointer flex items-center gap-1">
                            <span>🟡</span> Medium
                        </button>
                        <button id="btn-level-hard" onclick="setLevel('hard')" class="btn-level bg-white text-gray-700 hover:bg-red-100 font-bold px-4 sm:px-5 py-2 rounded-xl text-sm sm:text-base border border-gray-300 transition-all cursor-pointer flex items-center gap-1">
                            <span>🔴</span> Hard
                        </button>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 lg:gap-5 pb-6 mt-auto mb-auto" id="topic-grid">
                    <!-- Topic buttons will be injected here by JS -->
                </div>
            </div>

            <!-- QUIZ VIEW -->
            <div id="quiz-view" class="w-full h-full hidden flex-col fade-in pb-16">
                <!-- Top Bar in Quiz -->
                <div class="flex justify-between items-center mb-3 sm:mb-4">
                    <button id="btn-close-quiz" onclick="returnToMenu()" class="flex items-center gap-2 bg-red-100 text-red-600 hover:bg-red-200 px-3 sm:px-4 py-1.5 sm:py-2 rounded-full font-bold text-sm sm:text-base transition-colors shadow-sm cursor-pointer">
                        <span>❌</span> Menu
                    </button>
                    <div class="flex items-center gap-2">
                        <div id="quiz-level-badge" class="bg-emerald-500 text-white font-extrabold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-emerald-600 shadow-sm text-xs sm:text-sm uppercase flex items-center gap-1">
                            <span id="badge-icon">🟢</span> <span id="badge-text">Easy</span>
                        </div>
                        <div class="bg-indigo-100 text-indigo-800 font-bold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-indigo-200 shadow-sm text-sm sm:text-base">
                            Question <span id="question-number">1</span>/<span id="total-questions">5</span>
                        </div>
                    </div>
                </div>

                <!-- Topic Title -->
                <h2 id="current-topic-title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-center text-blue-600 mb-3 sm:mb-4 capitalize tracking-wide">Topic Name</h2>

                <!-- Question Card -->
                <div class="bg-white rounded-3xl shadow-xl border-4 border-blue-100 p-6 sm:p-10 lg:p-12 flex-grow flex flex-col justify-center max-w-3xl mx-auto w-full relative overflow-hidden my-auto">
                    
                    <!-- Decorative corner blobs -->
                    <div class="absolute -top-10 -left-10 w-32 h-32 bg-yellow-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 pointer-events-none"></div>
                    <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-pink-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 pointer-events-none"></div>

                    <!-- Question Text / Word -->
                    <div class="text-center my-auto py-2 sm:py-4 relative z-10">
                        <p id="question-prompt-label" class="text-gray-500 text-base sm:text-lg font-bold mb-2 tracking-wide">Apa bahasa Inggris dari:</p>
                        <h3 class="text-3xl sm:text-4xl lg:text-5xl text-indigo-700 tracking-wider font-black drop-shadow-sm my-3 sm:my-6 leading-relaxed" id="question-word">
                            HUJAN
                        </h3>
                    </div>

                    <!-- Answer / Interaction Area -->
                    <div id="interaction-area" class="relative z-10 w-full flex flex-col items-center gap-4 mt-4">
                        
                        <button id="btn-jawab" onclick="checkAnswer()" class="w-full max-w-md bg-yellow-400 hover:bg-yellow-500 text-yellow-950 font-extrabold text-xl sm:text-2xl py-3 sm:py-4 px-8 rounded-2xl shadow-lg transform transition-all hover:scale-105 active:scale-95 border-b-4 border-yellow-600 cursor-pointer flex items-center justify-center gap-2">
                            <span>👀</span> SHOW ANSWER
                        </button>
                        
                        <div id="answer-reveal-area" class="hidden w-full flex flex-col items-center fade-in">
                            <p id="reveal-message" class="text-sm sm:text-base font-bold uppercase tracking-widest mb-2">Jawaban:</p>
                            <div id="revealed-answer-text" class="text-2xl sm:text-3xl font-black px-6 py-4 sm:py-5 rounded-2xl border-4 w-full text-center shadow-inner leading-relaxed transition-colors">
                                <!-- Answer injected by JS -->
                            </div>
                        </div>
                    </div>
                </div>

                 <!-- Next Button Floating Bottom -->
                 <div class="absolute bottom-4 left-0 right-0 flex justify-center px-4 pointer-events-none z-20">
                     <button id="btn-next" onclick="nextQuestion()" class="hidden pointer-events-auto w-full max-w-sm bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-extrabold text-lg sm:text-xl py-3.5 sm:py-4 px-8 rounded-full shadow-xl transform transition-transform hover:scale-105 active:scale-95 border-4 border-white cursor-pointer flex items-center justify-center gap-2">
                         NEXT <i class="fas fa-arrow-right"></i>
                     </button>
                 </div>
            </div>

            <!-- RESULT SCREEN -->
            <div id="result-view" class="w-full h-full hidden flex-col items-center justify-center fade-in z-20">
                <div class="bg-white rounded-3xl shadow-2xl border-4 border-indigo-200 p-8 sm:p-12 max-w-md w-full text-center relative overflow-hidden">
                    <div class="text-6xl mb-4">🏆</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-indigo-700 mb-2">Well Done!</h2>
                    <p class="text-gray-500 font-bold text-lg mb-6">You've learned new words today.</p>
                    <div class="text-3xl sm:text-4xl font-black text-green-500 mb-8 drop-shadow-md">
                        <span id="final-total">5</span> Words Completed!
                    </div>
                    <button onclick="returnToMenu()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transform transition-all hover:scale-105 active:scale-95 border-b-4 border-indigo-700 text-xl">
                        Learn More!
                    </button>
                </div>
            </div>

        </main>
    </div>

    <script>
        const topics = [
            { id: 'telling-time', title: 'Telling Time (Jam)', icon: '⏱️', color: 'bg-red-400' },
            { id: 'weather', title: 'Weather (Cuaca)', icon: '⛅', color: 'bg-blue-400' },
            { id: 'hobbies', title: 'Hobbies (Hobi)', icon: '🎨', color: 'bg-purple-400' },
            { id: 'daily-activities', title: 'Daily Activities', icon: '🏃', color: 'bg-orange-400' },
            { id: 'directions', title: 'Directions (Arah)', icon: '🧭', color: 'bg-indigo-500' },
            { id: 'school-subjects', title: 'School Subjects', icon: '📚', color: 'bg-yellow-400' },
            { id: 'places', title: 'Places Around Us', icon: '🏥', color: 'bg-teal-400' },
            { id: 'describing-people', title: 'Describing People', icon: '🧑', color: 'bg-pink-400' },
            { id: 'possessive', title: 'Possessive', icon: '🎒', color: 'bg-indigo-400' },
            { id: 'there-is-are', title: 'There is / There are', icon: '🍎', color: 'bg-green-500' },
            { id: 'present-continuous', title: 'Present Continuous', icon: '📖', color: 'bg-cyan-500' },
            { id: 'body-parts', title: 'Parts of Body (Tubuh)', icon: '👁️', color: 'bg-rose-400' },
            { id: 'transportation', title: 'Transportation', icon: '🚗', color: 'bg-amber-500' },
            { id: 'rooms', title: 'Rooms (Ruangan)', icon: '🏠', color: 'bg-emerald-500' },
            { id: 'quantifiers', title: 'Quantifiers (Jumlah)', icon: '🔢', color: 'bg-violet-400' },
            { id: 'feelings', title: 'Feelings (Perasaan)', icon: '😊', color: 'bg-pink-500' },
            { id: 'currencies', title: 'Currencies (Mata Uang)', icon: '💵', color: 'bg-lime-500' },
            { id: 'dates', title: 'Dates (Tanggal & Hari)', icon: '📅', color: 'bg-sky-500' },
            { id: 'animals', title: 'Animals (Nama Hewan)', icon: '🦁', color: 'bg-amber-500' },
            { id: 'foods', title: 'Foods & Drinks', icon: '🍕', color: 'bg-rose-500' },
            { id: 'tastes', title: 'Tastes (Rasa Makanan)', icon: '🍋', color: 'bg-fuchsia-500' }
        ];

        // Question Bank organized by Topic and Difficulty Level (Easy, Medium, Hard)
        const questionBank = {
            'telling-time': {
                easy: [
                    { q: "Jam 7 tepat", eng: "Seven o'clock" },
                    { q: "Jam 12 tepat", eng: "Twelve o'clock" },
                    { q: "Setengah empat", eng: "Half past three" },
                    { q: "Pagi hari", eng: "Morning" },
                    { q: "Malam hari", eng: "Night" }
                ],
                medium: [
                    { q: "We go to school at ........ in the morning (07.00).", eng: "seven o'clock" },
                    { q: "It is 12.00 PM, which means it is ........ .", eng: "noon / midday" },
                    { q: "Half past three is written as ........ .", eng: "03.30" },
                    { q: "We sleep in the bed at ........ .", eng: "night" },
                    { q: "Breakfast is eaten in the ........ .", eng: "morning" }
                ],
                hard: [
                    { q: "I wake up at ........ in the morning (06:00).", eng: "six o'clock" },
                    { q: "We have breakfast in the ........ (Pagi)", eng: "morning" },
                    { q: "The clock shows 07.15 which is a ........ past seven.", eng: "quarter" },
                    { q: "12.00 in the day is ........", eng: "noon / midday" },
                    { q: "05.45 is a quarter to ........", eng: "six" }
                ]
            },
            'weather': {
                easy: [
                    { q: "Hujan", eng: "Rainy" },
                    { q: "Cerah", eng: "Sunny" },
                    { q: "Berawan", eng: "Cloudy" },
                    { q: "Berangin", eng: "Windy" },
                    { q: "Panas", eng: "Hot" }
                ],
                medium: [
                    { q: "It is ........ outside, so take an umbrella.", eng: "rainy" },
                    { q: "The sun is shining bright, today is very ........ .", eng: "sunny" },
                    { q: "The sky is full of clouds, it is a ........ day.", eng: "cloudy" },
                    { q: "The wind is blowing hard, today is ........ .", eng: "windy" },
                    { q: "In summer, the weather feels very ........ .", eng: "hot" }
                ],
                hard: [
                    { q: "When it is ........ , we wear a raincoat.", eng: "rainy" },
                    { q: "The sun makes the day ........ ", eng: "hot / sunny" },
                    { q: "After the heavy rain, a beautiful ........ appeared in the sky.", eng: "rainbow" },
                    { q: "In the ........ season it rains every day.", eng: "rainy" },
                    { q: "Listen to the loud ........ in the storm.", eng: "thunder" }
                ]
            },
            'hobbies': {
                easy: [
                    { q: "Membaca", eng: "Reading" },
                    { q: "Berenang", eng: "Swimming" },
                    { q: "Memancing", eng: "Fishing" },
                    { q: "Menari", eng: "Dancing" },
                    { q: "Memasak", eng: "Cooking" }
                ],
                medium: [
                    { q: "Budi is ........ movies with his friend.", eng: "watching" },
                    { q: "Siti loves ........ books in the school library.", eng: "reading" },
                    { q: "Dini goes to the pool because her hobby is ........ .", eng: "swimming" },
                    { q: "My father likes ........ fish in the river.", eng: "fishing" },
                    { q: "My mother is ........ delicious food in the kitchen.", eng: "cooking" }
                ],
                hard: [
                    { q: "Siti likes ........ books and writing stories.", eng: "reading" },
                    { q: "My brother enjoys playing ........ with his grandfather using black and white tiles.", eng: "chess" },
                    { q: "She likes ........ pictures using colorful paints.", eng: "painting" },
                    { q: "He is ........ a bicycle in the park.", eng: "riding / cycling" },
                    { q: "Taking pictures with a camera is called ........", eng: "photography" }
                ]
            },
            'daily-activities': {
                easy: [
                    { q: "Bangun tidur", eng: "Wake up" },
                    { q: "Mandi", eng: "Take a bath" },
                    { q: "Sarapan", eng: "Breakfast" },
                    { q: "Pergi ke sekolah", eng: "Go to school" },
                    { q: "Tidur", eng: "Sleep" }
                ],
                medium: [
                    { q: "I ........ my teeth every morning.", eng: "brush" },
                    { q: "We eat ........ in the morning before school.", eng: "breakfast" },
                    { q: "After playing, I always take a ........ .", eng: "bath / shower" },
                    { q: "At night, we go to bed to ........ .", eng: "sleep" },
                    { q: "I ........ my homework after school.", eng: "do" }
                ],
                hard: [
                    { q: "I wake up at 6, then I ........ my bed.", eng: "make" },
                    { q: "Before dinner, I always ........ my hands.", eng: "wash" },
                    { q: "We wear our ........ before going to school.", eng: "uniform" },
                    { q: "My mom cooks food in the ........ .", eng: "kitchen" },
                    { q: "I watch ........ in the living room.", eng: "tv / television" }
                ]
            },
            'directions': {
                easy: [
                    { q: "Belok kiri", eng: "Turn left" },
                    { q: "Belok kanan", eng: "Turn right" },
                    { q: "Jalan lurus", eng: "Go straight" },
                    { q: "Berhenti", eng: "Stop" },
                    { q: "Di dekat", eng: "Near" }
                ],
                medium: [
                    { q: "Menyeberang jalan", eng: "Cross the road / Cross the street" },
                    { q: "Di depan", eng: "In front of" },
                    { q: "Di belakang", eng: "Behind" },
                    { q: "Di sebelah", eng: "Next to / Beside" },
                    { q: "Sangat jauh", eng: "Far" }
                ],
                hard: [
                    { q: "The bank is ........ the corner (Di sudut).", eng: "at" },
                    { q: "The hospital is ........ the school and the park (Di antara).", eng: "between" },
                    { q: "Go straight, then ........ at the traffic light (Belok kanan).", eng: "turn right" },
                    { q: "Please ........ the road at the zebra cross (Menyeberang).", eng: "cross" },
                    { q: "My house is ........ the post office (Di sebelah).", eng: "next to" }
                ]
            }
        };

        // Auto-fill missing topics with generic dummy questions for the sake of completeness
        topics.forEach(topic => {
            if (!questionBank[topic.id]) {
                questionBank[topic.id] = {
                    easy: [
                        { q: `Satu (${topic.title})`, eng: "One" },
                        { q: `Dua (${topic.title})`, eng: "Two" },
                        { q: `Tiga (${topic.title})`, eng: "Three" },
                        { q: `Empat (${topic.title})`, eng: "Four" },
                        { q: `Lima (${topic.title})`, eng: "Five" }
                    ],
                    medium: [
                        { q: `What is 1+1? (${topic.title})`, eng: "Two" },
                        { q: `What is 2+1? (${topic.title})`, eng: "Three" },
                        { q: `What is 2+2? (${topic.title})`, eng: "Four" },
                        { q: `What is 3+2? (${topic.title})`, eng: "Five" },
                        { q: `What is 5+1? (${topic.title})`, eng: "Six" }
                    ],
                    hard: [
                        { q: `Translate 'Tujuh' (${topic.title})`, eng: "Seven" },
                        { q: `Translate 'Delapan' (${topic.title})`, eng: "Eight" },
                        { q: `Translate 'Sembilan' (${topic.title})`, eng: "Nine" },
                        { q: `Translate 'Sepuluh' (${topic.title})`, eng: "Ten" },
                        { q: `Translate 'Sebelas' (${topic.title})`, eng: "Eleven" }
                    ]
                };
            }
        });

        // App State
        let currentLevel = 'easy';
        let currentTopic = null;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let totalQuestions = 5;

        // Initialize Menu
        document.addEventListener('DOMContentLoaded', () => {
            renderTopics();
            setLevel('easy');
            
            // Fullscreen toggle logic
            document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
        });

        function renderTopics() {
            const grid = document.getElementById('topic-grid');
            grid.innerHTML = '';
            
            topics.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = `btn-topic ${topic.color} text-white font-bold p-3 sm:p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-lg hover:shadow-xl border-b-4 border-black/20 text-sm sm:text-base`;
                btn.onclick = () => startQuiz(topic);
                btn.innerHTML = `
                    <span class="text-3xl sm:text-4xl drop-shadow-md">${topic.icon}</span>
                    <span class="text-center leading-tight drop-shadow-sm">${topic.title}</span>
                `;
                grid.appendChild(btn);
            });
        }

        function setLevel(level) {
            currentLevel = level;
            
            // Reset all level buttons
            document.querySelectorAll('.btn-level').forEach(btn => {
                btn.classList.remove('bg-green-500', 'bg-yellow-400', 'bg-red-500', 'text-white', 'scale-105', 'border-green-600', 'border-yellow-500', 'border-red-600');
                btn.classList.add('bg-white', 'text-gray-700', 'border-gray-300');
            });
            
            // Highlight selected level
            const selectedBtn = document.getElementById(`btn-level-${level}`);
            selectedBtn.classList.remove('bg-white', 'text-gray-700', 'border-gray-300');
            selectedBtn.classList.add('text-white', 'scale-105');
            
            if (level === 'easy') {
                selectedBtn.classList.add('bg-green-500', 'border-green-600');
                document.getElementById('badge-icon').innerText = '🟢';
                document.getElementById('badge-text').innerText = 'Easy';
                document.getElementById('quiz-level-badge').className = 'bg-emerald-500 text-white font-extrabold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-emerald-600 shadow-sm text-xs sm:text-sm uppercase flex items-center gap-1';
            } else if (level === 'medium') {
                selectedBtn.classList.add('bg-yellow-400', 'border-yellow-500');
                document.getElementById('badge-icon').innerText = '🟡';
                document.getElementById('badge-text').innerText = 'Medium';
                document.getElementById('quiz-level-badge').className = 'bg-yellow-500 text-white font-extrabold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-yellow-600 shadow-sm text-xs sm:text-sm uppercase flex items-center gap-1';
            } else {
                selectedBtn.classList.add('bg-red-500', 'border-red-600');
                document.getElementById('badge-icon').innerText = '🔴';
                document.getElementById('badge-text').innerText = 'Hard';
                document.getElementById('quiz-level-badge').className = 'bg-red-500 text-white font-extrabold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-red-600 shadow-sm text-xs sm:text-sm uppercase flex items-center gap-1';
            }
        }

        function startQuiz(topic) {
            currentTopic = topic;
            document.getElementById('current-topic-title').innerText = topic.title;
            
            // Get questions for topic and level, shuffle them
            let rawQuestions = [...questionBank[topic.id][currentLevel]];
            // Slicing after shuffling ensures we NEVER get duplicate questions in a single round
            currentQuestions = rawQuestions.sort(() => 0.5 - Math.random()).slice(0, 5); 
            totalQuestions = currentQuestions.length;
            document.getElementById('total-questions').innerText = totalQuestions;
            
            currentQuestionIndex = 0;
            
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            const questionData = currentQuestions[currentQuestionIndex];
            
            // Update UI
            document.getElementById('question-number').innerText = currentQuestionIndex + 1;
            document.getElementById('question-word').innerText = questionData.q;
            
            // Reset Interaction Area
            document.getElementById('answer-reveal-area').classList.add('hidden');
            document.getElementById('btn-jawab').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
        }

        function checkAnswer() {
            const currentData = currentQuestions[currentQuestionIndex];
            revealAnswerUI(currentData.eng);
        }

        function revealAnswerUI(correctAnswerText) {
            const revealArea = document.getElementById('answer-reveal-area');
            const revealText = document.getElementById('revealed-answer-text');
            const revealMessage = document.getElementById('reveal-message');
            
            // Hide Check button, Show Next button and Reveal area
            document.getElementById('btn-jawab').classList.add('hidden');
            revealArea.classList.remove('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            
            revealMessage.innerText = 'Jawaban:';
            revealMessage.className = 'text-blue-600 text-sm sm:text-base font-bold uppercase tracking-widest mb-2';
            
            revealText.innerText = correctAnswerText;
            revealText.className = 'text-2xl sm:text-3xl font-black text-white bg-blue-500 px-6 py-4 sm:py-5 rounded-2xl border-4 border-blue-600 w-full text-center shadow-inner leading-relaxed transition-colors';
            
            throwConfetti(15); // Small confetti to celebrate learning
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestions) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            
            document.getElementById('final-total').innerText = totalQuestions;
            
            throwConfetti(50); // Big confetti for finishing
        }

        function returnToMenu() {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('menu-view').classList.remove('hidden');
        }

        function throwConfetti(amount) {
            const colors = ['#22c55e', '#3b82f6', '#f59e0b', '#ef4444', '#a855f7'];
            for(let i = 0; i < amount; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti rounded-sm';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-20px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(conf);
                
                // Cleanup
                setTimeout(() => conf.remove(), 5000);
            }
        }

        function toggleFullscreen() {
            const app = document.getElementById('app');
            const icon = document.getElementById('fullscreen-icon');
            const text = document.getElementById('fullscreen-text');

            if (!document.fullscreenElement) {
                if (app.requestFullscreen) {
                    app.requestFullscreen().catch(err => {
                        app.classList.toggle('is-pseudo-fullscreen');
                    });
                } else {
                    app.classList.toggle('is-pseudo-fullscreen');
                }
                icon.innerText = '🗗';
                text.innerText = 'Exit Full Screen';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                app.classList.remove('is-pseudo-fullscreen');
                icon.innerText = '⛶';
                text.innerText = 'Full Screen';
            }
        }
    </script>
</body>
</html>
