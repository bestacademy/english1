<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun English Quiz for Kids!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4; /* Light green background */
            /* Add a subtle background pattern */
            background-image: radial-gradient(#dcfce7 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .btn-topic {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-topic:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .btn-answer {
            transition: all 0.2s;
        }
        .btn-answer:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }
        .correct-answer {
            background-color: #22c55e !important; /* Green-500 */
            color: white !important;
            border-color: #16a34a !important;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }
        .wrong-answer {
            background-color: #ef4444 !important; /* Red-500 */
            color: white !important;
            border-color: #dc2626 !important;
        }
        /* Confetti Animation for perfect score */
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #fcd34d;
            animation: confetti-fall 3s linear infinite;
            z-index: 50;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* Fallback Pseudo Fullscreen when permissions policy restricts native fullscreen in iFrames */
        .is-pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            margin: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 99999 !important;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

        // --- APP STATE ---
        let currentTopicId = '';
        let currentTopic = null;
        let currentQuestionCount = 0;
        let currentLevel = 'easy'; // Default level: 'easy', 'medium', 'hard'

        // --- DOM ELEMENTS ---
        const menuView = document.getElementById('menu-view');
        const quizView = document.getElementById('quiz-view');
        const topicGrid = document.getElementById('topic-grid');
        
        const scoreDisplay = document.getElementById('score-display');
        
        const btnCloseQuiz = document.getElementById('btn-close-quiz');
        const currentTopicTitle = document.getElementById('current-topic-title');
        const questionNumberEl = document.getElementById('question-number');
        const questionWord = document.getElementById('question-word');
        const btnJawab = document.getElementById('btn-jawab');
        const answerRevealArea = document.getElementById('answer-reveal-area');
        const revealedAnswerText = document.getElementById('revealed-answer-text');
        const btnNext = document.getElementById('btn-next');

        // Level Elements
        const btnLevelEasy = document.getElementById('btn-level-easy');
        const btnLevelMedium = document.getElementById('btn-level-medium');
        const btnLevelHard = document.getElementById('btn-level-hard');
        const quizLevelBadge = document.getElementById('quiz-level-badge');
        const questionPromptLabel = document.getElementById('question-prompt-label');

        // --- INITIALIZATION ---
        function initApp() {
            // Render Topic Buttons
            topics.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = `${topic.color} text-white p-4 sm:p-5 lg:p-6 rounded-2xl shadow-md btn-topic flex flex-col items-center justify-center gap-2 sm:gap-3 border-4 border-white cursor-pointer hover:scale-105 transition-transform`;
                btn.innerHTML = `
                    <span class="text-3xl sm:text-4xl lg:text-5xl drop-shadow-md">${topic.icon}</span>
                    <span class="font-extrabold text-sm sm:text-base lg:text-lg drop-shadow-md leading-tight text-center">${topic.title}</span>
                `;
                btn.onclick = () => startQuiz(topic.id);
                topicGrid.appendChild(btn);
            });

            // Level Buttons Handlers
            btnLevelEasy.onclick = () => setDifficultyLevel('easy');
            btnLevelMedium.onclick = () => setDifficultyLevel('medium');
            btnLevelHard.onclick = () => setDifficultyLevel('hard');

            // Event Listeners
            btnCloseQuiz.onclick = returnToMenu;
            btnJawab.onclick = revealAnswer;
            btnNext.onclick = showNextQuestion;

            // Fullscreen Listener
            document.getElementById('btn-fullscreen').onclick = toggleFullscreen;
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) isPseudoFullscreen = false;
                updateFullscreenState();
            });
            document.addEventListener('webkitfullscreenchange', () => {
                if (!document.webkitFullscreenElement) isPseudoFullscreen = false;
                updateFullscreenState();
            });
        }

        function setDifficultyLevel(level) {
            currentLevel = level;

            // Reset buttons style
            const levelBtns = [
                { id: 'easy', btn: btnLevelEasy, color: 'bg-green-500 border-green-600', icon: '🟢', text: 'Easy' },
                { id: 'medium', btn: btnLevelMedium, color: 'bg-yellow-500 border-yellow-600', icon: '🟡', text: 'Medium' },
                { id: 'hard', btn: btnLevelHard, color: 'bg-red-500 border-red-600', icon: '🔴', text: 'Hard' }
            ];

            levelBtns.forEach(item => {
                if (item.id === level) {
                    item.btn.className = `btn-level ${item.color} text-white font-bold px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm shadow-md border-2 transform scale-105 transition-all cursor-pointer flex items-center gap-1`;
                } else {
                    item.btn.className = `btn-level bg-white text-gray-700 hover:bg-gray-100 font-bold px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm border border-gray-300 transition-all cursor-pointer flex items-center gap-1`;
                }
            });

            // Update Quiz View Badge
            if (level === 'easy') {
                quizLevelBadge.className = 'bg-emerald-500 text-white font-extrabold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-emerald-600 shadow-sm text-xs sm:text-sm uppercase flex items-center gap-1';
                quizLevelBadge.innerHTML = '<span>🟢</span> Easy';
            } else if (level === 'medium') {
                quizLevelBadge.className = 'bg-yellow-500 text-white font-extrabold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-yellow-600 shadow-sm text-xs sm:text-sm uppercase flex items-center gap-1';
                quizLevelBadge.innerHTML = '<span>🟡</span> Medium';
            } else if (level === 'hard') {
                quizLevelBadge.className = 'bg-red-500 text-white font-extrabold px-3 sm:px-4 py-1.5 sm:py-2 rounded-full border-2 border-red-600 shadow-sm text-xs sm:text-sm uppercase flex items-center gap-1';
                quizLevelBadge.innerHTML = '<span>🔴</span> Hard';
            }
        }

        // --- FULLSCREEN CONTROLLER ---
        let isPseudoFullscreen = false;

        function toggleFullscreen() {
            if (isPseudoFullscreen) {
                exitPseudoFullscreen();
                return;
            }

            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                const docEl = document.documentElement;
                let promise = null;

                try {
                    if (docEl.requestFullscreen) {
                        promise = docEl.requestFullscreen();
                    } else if (docEl.webkitRequestFullscreen) {
                        promise = docEl.webkitRequestFullscreen();
                    } else if (docEl.msRequestFullscreen) {
                        promise = docEl.msRequestFullscreen();
                    }

                    if (promise && typeof promise.catch === 'function') {
                        promise.catch(err => {
                            console.warn("Native fullscreen denied by permissions policy. Falling back to pseudo-fullscreen mode.", err);
                            enterPseudoFullscreen();
                        });
                    }
                } catch (e) {
                    enterPseudoFullscreen();
                }
            } else {
                try {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    else if (document.msExitFullscreen) document.msExitFullscreen();
                } catch (e) {
                    console.warn(e);
                }
            }
        }

        function enterPseudoFullscreen() {
            isPseudoFullscreen = true;
            const appContainer = document.getElementById('app');
            if (appContainer) {
                appContainer.classList.add('is-pseudo-fullscreen');
            }
            updateFullscreenState();
        }

        function exitPseudoFullscreen() {
            isPseudoFullscreen = false;
            const appContainer = document.getElementById('app');
            if (appContainer) {
                appContainer.classList.remove('is-pseudo-fullscreen');
            }
            updateFullscreenState();
        }

        function updateFullscreenState() {
            const isNativeFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            const isFs = isNativeFs || isPseudoFullscreen;
            
            const fsIcon = document.getElementById('fullscreen-icon');
            const fsText = document.getElementById('fullscreen-text');
            
            if (fsIcon && fsText) {
                if (isFs) {
                    fsIcon.textContent = '✕';
                    fsText.textContent = 'Exit Screen';
                } else {
                    fsIcon.textContent = '⛶';
                    fsText.textContent = 'Full Screen';
                }
            }
        }

        // --- QUIZ LOGIC ---
        function startQuiz(topicId) {
            currentTopicId = topicId;
            currentTopic = topics.find(t => t.id === topicId);
            currentQuestionCount = 1;

            // Update UI
            currentTopicTitle.textContent = currentTopic.title;
            currentTopicTitle.className = `text-xl sm:text-2xl font-extrabold text-center mb-4 capitalize px-4 py-2 rounded-full inline-block mx-auto text-white ${currentTopic.color}`;
            
            scoreDisplay.classList.add('hidden');

            switchView(quizView);
            loadQuestion();
        }

        function loadQuestion() {
            const topicData = questionBank[currentTopicId];
            let pool = topicData ? (topicData[currentLevel] || topicData['easy']) : [];
            
            if (!pool || pool.length === 0) {
                pool = [{ q: "Sample Question", eng: "Sample Answer" }];
            }

            // Set Prompt Label based on difficulty level
            if (currentLevel === 'easy') {
                questionPromptLabel.textContent = 'Apa bahasa Inggris dari:';
            } else if (currentLevel === 'medium') {
                questionPromptLabel.textContent = 'Lengkapi kalimat berikut (1 Isian):';
            } else if (currentLevel === 'hard') {
                questionPromptLabel.textContent = 'Lengkapi kalimat berikut (2 Isian):';
            }
            
            // Pick a random question from the level pool
            const randomIndex = Math.floor(Math.random() * pool.length);
            const qData = pool[randomIndex];
            
            // Set values
            questionNumberEl.textContent = currentQuestionCount;
            questionWord.textContent = qData.q;
            revealedAnswerText.textContent = qData.eng;

            // Reset UI for answering
            btnJawab.classList.remove('hidden');
            answerRevealArea.classList.add('hidden');
            btnNext.classList.add('hidden');
        }

        function revealAnswer() {
            // Show the answer
            btnJawab.classList.add('hidden');
            answerRevealArea.classList.remove('hidden');
            btnNext.classList.remove('hidden');
            
            // Play sound
            playSound('correct');
        }

        function showNextQuestion() {
            currentQuestionCount++;
            loadQuestion();
        }

        function returnToMenu() {
            switchView(menuView);
        }

        // --- HELPERS ---
        function switchView(viewToShow) {
            menuView.classList.add('hidden');
            quizView.classList.add('hidden');
            viewToShow.classList.remove('hidden');
            viewToShow.classList.add('fade-in');
        }

        // Audio helper
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Start App
        window.onload = initApp;
